trigger:
- master

stages:

- stage: Build

  jobs:

  - job: BuildJob

    pool:
      vmImage: ubuntu-latest

    steps:

    - task: Maven@3
      inputs:
        mavenPomFile: 'pom.xml'
        goals: 'package'

    - task: CopyFiles@2
      inputs:
        Contents: '**/*.war'
        TargetFolder: '$(Build.ArtifactStagingDirectory)'

    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'warfile'

- stage: Deploy

  dependsOn: Build

  jobs:

  - deployment: DeployToTomcat

    environment: production

    strategy:

      runOnce:

        deploy:

          steps:

          - download: current
            artifact: warfile

          - script: |
              echo "WAR files available:"
              ls -l $(Pipeline.Workspace)/warfile

              cp $(Pipeline.Workspace)/warfile/webapp.war \
                 /opt/tomcat/webapps/

            displayName: Deploy WAR