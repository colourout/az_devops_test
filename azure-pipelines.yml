trigger:
- master

stages:

- stage: Build

  jobs:

  - job: BuildJob

    pool:
      vmImage: ubuntu-latest

    steps:

    - task: Maven@3
      inputs:
        mavenPomFile: 'pom.xml'
        goals: 'package'

    - task: CopyFiles@2
      inputs:
        Contents: '**/*.war'
        TargetFolder: '$(Build.ArtifactStagingDirectory)'

    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'warfile'

- stage: Deploy

  dependsOn: Build

  jobs:

  - deployment: DeployToTomcat

    environment:
      name: production
      resourceName: azuredevopshosting
      resourceType: VirtualMachine
    strategy:
      runOnce:
        deploy:
          steps:

          - script: |
              WAR_FILE=$(find $(Pipeline.Workspace) -name "*.war" | head -1)

              echo "WAR file found: $WAR_FILE"

              rm -rf /opt/tomcat/webapps/webapp
              rm -f /opt/tomcat/webapps/webapp.war

              cp "$WAR_FILE" /opt/tomcat/webapps/

              echo "Deployment completed."

            displayName: Deploy WAR

- stage: AutomationTest

  displayName: Run Automation Tests

  dependsOn: Deploy

  jobs:
  - deployment: SeleniumTests

    environment:
      name: production
      resourceType: VirtualMachine
      resourceName: azuredevopshosting

    strategy:
      runOnce:
        deploy:
          steps:

          - script: |
              cd /home/devopsuser/az_devops_automation_test

              mvn clean test \
              -Dtest=BrowserTest \
              -Dapp.url=http://20.198.92.89:8080/webapp/

            displayName: Run Selenium Tests            